<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>數學作業繳交查詢系統</title>
    <!-- 引入 Tailwind CSS 以進行快速且美觀的樣式設計[cite: 1] -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 引入 Google 字體[cite: 1] */
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif; /*[cite: 1] */
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen text-gray-800">

    <!-- 主要內容區塊 (沿用原本的卡片設計)[cite: 1] -->
    <main class="bg-white p-8 md:p-12 rounded-2xl shadow-lg max-w-lg w-full mx-4 transition-all duration-300 hover:shadow-xl">
        
        <!-- 標題區[cite: 1] -->
        <header class="text-center mb-8">
            <div class="inline-block p-3 bg-blue-100 text-blue-600 rounded-full mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-gray-900 mb-2">數學作業繳交查詢</h1>
            <p class="text-gray-500">請選擇班級查看未繳與請假待補作業</p>
        </header>

        <!-- 內容區：五個網頁的導覽按鈕 -->
        <section class="space-y-6">
            <!-- 4 個班級查詢按鈕（2x2 網格排列） -->
            <div class="grid grid-cols-2 gap-3">
                <a href="class103.html" class="block text-center bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-xl shadow-sm transition-all duration-200 hover:-translate-y-0.5">
                    103班
                </a>
                <a href="class104.html" class="block text-center bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-xl shadow-sm transition-all duration-200 hover:-translate-y-0.5">
                    104班
                </a>
                <a href="class105.html" class="block text-center bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-xl shadow-sm transition-all duration-200 hover:-translate-y-0.5">
                    105班
                </a>
                <a href="class206.html" class="block text-center bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 px-4 rounded-xl shadow-sm transition-all duration-200 hover:-translate-y-0.5">
                    206班
                </a>
            </div>

            <hr class="border-gray-200">

            <!-- 老師管理後台按鈕 -->
            <div>
                <a href="teacher.html" class="block text-center bg-slate-800 hover:bg-slate-900 text-white font-bold py-3.5 px-6 rounded-xl shadow-sm transition-all duration-200">
                    管理後台
                </a>
            </div>
        </section>

        <!-- 底部互動區 (保留原本的測試按鈕，不需要可隨時刪除)[cite: 1] -->
        <footer class="mt-8 pt-6 border-t border-gray-100 text-center">
            <button id="drawBtn" class="text-sm bg-amber-100 hover:bg-amber-200 text-amber-800 font-bold py-2 px-5 rounded-lg transition-colors duration-200">
                    今日運勢
            </button>
            <div id="fortuneResult" class="mt-3 text-sm text-gray-700"></div>
        </footer>

    </main>

    <!-- 簡單的 JavaScript 互動[cite: 1] -->
    <script>
        // 顯示訊息
        function showMessage() {
            const messageArea = document.getElementById('message-area'); //[cite: 1]
            messageArea.classList.remove('hidden'); //[cite: 1]
            setTimeout(() => {
                messageArea.classList.add('hidden'); //[cite: 1]
            }, 3000); //[cite: 1]
        }
        // 設定運勢清單（可自行增減內容）
        const fortunes = [
            { level: "大吉 🌟", desc: "萬事如意，今天做什麼都會非常順利！" },
            { level: "中吉 ✨", desc: "心情愉快，會有意想不到的小確幸。" },
            { level: "小吉 🍀", desc: "平穩順心，按部就班就能達成目標。" },
            { level: "吉 🌸",   desc: "保持微笑，好運正在慢慢靠近你。" },
            { level: "末吉 🍃", desc: "稍微耐心等待，轉機很快就會出現。" },
            { level: "凶 🌧️",   desc: "今天宜低調行事，凡事多一分謹慎即可化解。" }
          ];
        
        const drawBtn = document.getElementById('drawBtn');
        const resultBox = document.getElementById('fortuneResult');
        
        // 監聽按鈕點擊事件
        drawBtn.addEventListener('click', () => {
        // 產生 0 到 (陣列長度 - 1) 之間的隨機整數
        const randomIndex = Math.floor(Math.random() * fortunes.length);
        const picked = fortunes[randomIndex];
        
        // 將抽中的運勢更新到畫面上
        resultBox.innerHTML = `
            <p style="font-size: 24px; color: #d97706; margin: 8px 0;">${picked.level}</p>
            <p style="font-size: 16px; color: #4b5563; font-weight: normal;">${picked.desc}</p>
            `;
          });
    </script>
</body>
</html>
